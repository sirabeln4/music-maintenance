[project]
name = "music-maintenance"
version = "0.13.1"
description = "Read-only catalog and maintenance planning for MP3 and WMA libraries"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "mutagen>=1.47,<2",
  "certifi>=2024.2.2",
  "pyacoustid>=1.3,<2",
]

[project.scripts]
music-maintenance = "music_maintenance.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
